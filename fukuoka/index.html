<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>車寄せ入口案内｜グランドメゾン福岡</title>

<style>
body{
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:40px 0;
}

.card{
  background:#fff;
  max-width:760px;
  margin:0 auto;
  padding:36px 32px 40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
}

/* タイトル */
/* タイトル（改行なし・はみ出し防止） */
h1{
  font-size: clamp(18px, 3.2vw, 26px); /* ← PCでデカくなりすぎない */
  margin: 0 0 10px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;

  white-space: nowrap;      /* 絶対に改行しない */
  overflow: hidden;         /* 枠からはみ出さない */
  text-overflow: clip;      /* …にもしない */
  max-width: 100%;          /* これ重要 */
  padding: 0 12px;          /* 枠ギリギリ回避 */
  box-sizing: border-box;
}

.between-title{
  margin: 24px 0 32px;
  font-size: clamp(22px, 4vw, 30px);
  font-weight: 700;
  text-align: center;
}

figure{
  margin-bottom: 48px;
}

.focus-text{
  margin-top: 48px;
}


/* 注意ボックス */
.notice{
  margin:22px 0 24px;
  padding:14px 16px;
  background:#f0f6ff;
  border-left:4px solid #3b82f6;
  border-radius:8px;
  text-align:left;
  font-size:15px;
}
.notice strong{
  color:#1e40af;
}

/* 説明文 */
.desc{
  text-align:left;
  font-size:15px;
  line-height:1.7;
  margin-bottom:28px;
}

/* 写真 */
figure{
  margin:0 0 26px;
}
figure img{
  width:100%;
  max-width:520px;
  border-radius:14px;
}
figcaption{
  margin-top:10px;
  font-size:2em;
  font-weight:700;
}

/* ★ここが重要：2行分の空白 */
.space-2lines{
  height:3.2em; /* ← テキスト2行分を確保 */
}

/* 強調テキスト */
.focus-text{
  font-size:2em;
  font-weight:800;
  margin-bottom:10px;
}

/* Googleマップリンク */
.map-link{
  display:inline-block;
  margin-top:10px;
  font-size:2.5em;
  font-weight:700;
  color:#1a73e8;
  text-decoration:none;
}
.map-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="card">

  <h1>【グランドメゾン福岡 The Central Luxe　車寄せ入口】</h1>

  <div class="notice">
    ✅ <strong>重要：</strong>正面玄関前ではなく  
    「<strong>車寄せ入口（リハビリ専門学校側）</strong>」へお越しください
  </div>

  <div class="desc">
    車寄せの入口は建物の北西側、リハビリ専門学校側にあります。<br>
    建物周辺に着いたら、正面で停めずにリハビリ専門学校側の車路（車寄せ入口）へ回り込み、  
    屋根のある車寄せスペースに進入してください。
  </div>

  <!-- 写真1：外観（入り方） -->
<figure>
  <img src="./images/wide.jpg" alt="車寄せの入り方">
</figure>

<!-- 写真の間のタイトル -->
<div class="between-title">車寄せ入口</div>

<!-- 写真2：車寄せ（室内） -->
<figure>
  <img src="./images/entrance.jpg" alt="車寄せ入口">
</figure>

<!-- 強調テキスト -->
<div class="focus-text">▼ この辺りに入口があります ▼</div>


  <!-- Googleマップリンク -->
  <a
    class="map-link"
    href="https://www.google.com/maps/place/33%C2%B035'00.7%22N+130%C2%B024'07.7%22E/@33.5834536,130.4021623,21z"
    target="_blank"
  >
    Googleマップで場所を確認する
  </a>

</div>

</body>
</html>
