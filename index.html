<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>グランドメゾン福岡 The Central Luxe｜車寄せ入口案内</title>

<style>
body{
  margin:0;
  background:#f6f7f8;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

.wrapper{
  max-width:520px;
  margin:40px auto;
  padding:0 16px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px 20px 26px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
  font-size:18px;
  font-weight:600;
  margin:0;
}

.map-link{
  font-size:12px;
  margin-top:6px;
}

.map-link a{
  color:#3b6eea;
  text-decoration:none;
}

.map-link a:hover{
  text-decoration:underline;
}

.notice{
  margin-top:16px;
  padding:12px 14px;
  background:#f1f6ff;
  border-left:4px solid #3b6eea;
  font-size:14px;
  line-height:1.6;
}

.notice strong{
  color:#1f4bd8;
}

.text{
  margin-top:14px;
  font-size:14px;
  line-height:1.7;
  color:#333;
}

.photo-list{
  display:flex;
  flex-direction:column;
  gap:18px;
  margin-top:18px;
  align-items:center;
}

.photo-list figure{
  margin:0;
  text-align:center;
}

.photo-list img{
  width:100%;
  max-width:340px;
  border-radius:14px;
  border:1px solid #e6e6e6;
  display:block;
}

.photo-list figcaption{
  font-size:13px;
  color:#666;
  margin-top:6px;
}

.note{
  margin-top:16px;
  font-size:12px;
  color:#666;
}
</style>

</head>
<body>

<div class="wrapper">
  <div class="card">

    <h1>グランドメゾン福岡 The Central Luxe　車寄せ入口</h1>
    <div class="map-link">
      <a href="https://www.google.com/maps/place/33%C2%B035'00.7%22N+130%C2%B024'07.7%22E/@33.5834536,130.4021623,21z/data=!4m4!3m3!8m2!3d33.583528!4d130.4021251!5m1!1e4!18m1!1e1?entry=ttu" target="_blank" rel="noopener">
        Googleマップで場所を確認する
      </a>
    </div>

    <div class="notice">
      ✅ <strong>重要：</strong>正面玄関前ではなく  
      <strong>「車寄せ入口（北西側）」</strong>へお越しください
    </div>

    <div class="text">
      車寄せの入口は建物の<strong>北西側</strong>にあります。<br>
      建物周辺に着いたら、正面で停めずに北西側の車路（車寄せ入口）へ回り込み、
      屋根のある車寄せスペースに進入してください。
    </div>

    <div class="photo-list">
      <figure>
        <img src="fukuoka/images/entrance.jpg" alt="車寄せ入口（北西側）">
        <figcaption>車寄せ入口（北西側）</figcaption>
      </figure>

      <figure>
        <img src="fukuoka/images/wide.jpg" alt="入口が分かる引きの写真">
        <figcaption>入口が分かる引きの写真</figcaption>
      </figure>
    </div>

    <div class="note">
      ※出口は北東側です。
    </div>

  </div>
</div>

</body>
</html>
