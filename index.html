<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タクシー案内</title>

<style>
  body{
    background:#f3f4f6;
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    color:#333;
  }

  .wrapper{
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }

  .card{
    background:#fff;
    width:100%;
    max-width:720px; /* ← 白い枠の幅（元の広さ） */
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
    padding:28px 26px 30px;
    box-sizing:border-box;
    text-align:center; /* 全体中央揃え */
  }

  h1{
    font-size:20px;
    margin:0 0 6px;
    font-weight:700;
  }

  .map-link{
    font-size:14px;          /* 少し大きめ */
    color:#2563eb;
    text-decoration:none;
    display:inline-block;
    margin-bottom:16px;
  }

  .map-link:hover{
    text-decoration:underline;
  }

  .notice{
    background:#f1f7ff;
    border-left:4px solid #2563eb;
    padding:12px 14px;
    border-radius:6px;
    font-size:14px;
    margin-bottom:16px;
    text-align:left;
  }

  .notice strong{
    color:#2563eb;
    font-weight:700;
  }

  .desc{
    font-size:14px;
    line-height:1.7;
    margin:0 auto 22px;
    text-align:left;
  }

  .photo-list{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  .photo-list figure{
    margin:0;
  }

  .photo-list img{
    width:100%;
    max-width:420px;
    border-radius:14px;
    border:1px solid #eee;
    display:block;
    margin:0 auto;
  }

  .photo-list figcaption{
    font-size:12px;
    color:#666;
    margin-top:6px;
  }

  .note{
    font-size:11px;
    color:#666;
    margin-top:18px;
    text-align:left;
  }
</style>
</head>

<body>
  <div class="wrapper">
    <div class="card">

      <h1>【グランドメゾン福岡 The Central Luxe　車寄せ入口】</h1>

      <a
        class="map-link"
        href="https://www.google.com/maps/place/33%C2%B035'00.7%22N+130%C2%B024'07.7%22E/@33.5834536,130.4021623,21z"
        target="_blank"
        rel="noopener"
      >
        Googleマップで場所を確認する
      </a>

      <div class="notice">
        ✅ <strong>重要</strong>：正面玄関前ではなく
        <strong>「車寄せ入口（北西側）」</strong>へお越しください
      </div>

      <div class="desc">
        車寄せの入口は建物の北西側にあります。<br>
        建物周辺に着いたら、正面で停めずに北西側の車路（車寄せ入口）へ回り込み、
        屋根のある車寄せスペースに進入してください。
      </div>

      <div class="photo-list">
        <figure>
          <img src="fukuoka/images/entrance.jpg" alt="車寄せ入口（北西側）">
          <figcaption>車寄せ入口（北西側）</figcaption>
        </figure>

        <figure>
          <img src="fukuoka/images/wide.jpg" alt="入口が分かる引きの写真">
          <figcaption>入口が分かる引きの写真</figcaption>
        </figure>
      </div>

      <div class="note">
        ※出口は北東側です。
      </div>

    </div>
  </div>
</body>
</html>
