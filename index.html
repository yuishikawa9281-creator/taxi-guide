<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車寄せ入口案内</title>

<style>
body{
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:40px 0;
}

/* 白いカード */
.card{
  background:#fff;
  max-width:760px;
  margin:0 auto;
  padding:36px 32px 40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
}

/* ★タイトル：今の2倍サイズ */
h1{
  font-size:44px;          /* ← 2倍 */
  margin:0 0 18px;
  font-weight:800;
}

/* 注意ボックス */
.notice{
  margin:22px 0 24px;
  padding:14px 16px;
  background:#f0f6ff;
  border-left:4px solid #3b82f6;
  border-radius:8px;
  text-align:left;
  font-size:15px;
}
.notice strong{
  color:#1e40af;
}

/* 説明文 */
.desc{
  text-align:left;
  font-size:15px;
  line-height:1.7;
  margin-bottom:28px;
}

/* 写真 */
figure{
  margin:0 0 26px;
}
figure img{
  width:100%;
  max-width:520px;
  border-radius:14px;
}
figcaption{
  margin-top:10px;
  font-size:2em;
  font-weight:700;
}

/* ★2行分の空白（視覚的に確実） */
.space-2lines{
  height:3.2em;
}

/* 強調テキスト */
.focus-text{
  font-size:2em;
  font-weight:800;
}

/* Googleマップリンク（大きめ） */
.map-link{
  display:inline-block;
  margin-top:10px;
  font-size:2.5em;
  font-weight:700;
  color:#1a73e8;
  text-decoration:none;
}
.map-link:hover{
  text-decoration:underline;
}

/* スマホ調整 */
@media (max-width: 640px){
  h1{ font-size:32px; }        /* スマホでは少し抑える */
  .focus-text{ font-size:1.6em; }
  .map-link{ font-size:1.8em; }
}
</style>
</head>

<body>

<div class="card">

  <h1>【グランドメゾン福岡 The Central Luxe　車寄せ入口】</h1>

  <div class="notice">
    ✅ <strong>重要：</strong>
    正面玄関前ではなく
    「<strong>車寄せ入口（北西側）</strong>」へお越しください
  </div>

  <div class="desc">
    車寄せの入口は建物の北西側にあります。<br>
    建物周辺に着いたら、正面で停めずに北西側の車路（車寄せ入口）へ回り込み、
    屋根のある車寄せスペースに進入してください。
  </div>

  <!-- 写真① -->
  <figure>
    <img src="fukuoka/images/entrance.jpg" alt="車寄せ入口（北西側）">
    <figcaption>車寄せ入口（北西側）</figcaption>
  </figure>

  <!-- 写真② -->
  <figure>
    <img src="fukuoka/images/wide.jpg" alt="入口位置の目安">
  </figure>

  <!-- ★2行分の空白 -->
  <div class="space-2lines"></div>

  <!-- 強調文 -->
  <div class="focus-text">▼ この辺りに入り口があります ▼</div>

  <!-- Googleマップ -->
  <a
    class="map-link"
    href="https://www.google.com/maps/place/33%C2%B035'00.7%22N+130%C2%B024'07.7%22E/@33.5834536,130.4021623,21z"
    target="_blank"
    rel="noopener"
  >
    Googleマップで場所を確認する
  </a>

</div>

</body>
</html>
