<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タクシー案内</title>

<style>
body{
  background:#f4f4f4;
  font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  margin:0;
  padding:40px 0;
}

/* 白いカード */
.card{
  background:#fff;
  width:720px;              /* ← 幅を元に近いサイズへ */
  max-width:92%;
  margin:0 auto;
  padding:28px 28px 32px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
  text-align:center;        /* 全体中央揃え */
}

/* タイトル */
h1{
  font-size:20px;
  margin:0 0 6px;
  font-weight:700;
}

/* Googleマップリンク */
.map-link{
  display:inline-block;
  font-size:14px;           /* 少し大きく */
  margin-bottom:16px;
}
.map-link a{
  color:#2563eb;
  text-decoration:none;
}
.map-link a:hover{
  text-decoration:underline;
}

/* 注意ボックス */
.notice{
  background:#f1f6ff;
  border-left:4px solid #2563eb;
  padding:12px 14px;
  font-size:14px;
  margin-bottom:18px;
  text-align:center;
}

/* 説明文 */
.description{
  font-size:14px;
  line-height:1.7;
  color:#333;
  margin-bottom:18px;
}

/* 写真エリア */
.photo-list{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}

.photo-list figure{
  margin:0;
}

.photo-list img{
  width:100%;
  max-width:420px;          /* 写真サイズは適度に */
  border-radius:14px;
  border:1px solid #e5e5e5;
  display:block;
  margin:0 auto;
}

.photo-list figcaption{
  font-size:12px;
  color:#666;
  margin-top:6px;
}

/* 補足 */
.note{
  font-size:12px;
  color:#666;
  margin-top:18px;
}
</style>

</head>
<body>

<div class="card">

  <h1>【グランドメゾン福岡 The Central Luxe　車寄せ入口】</h1>

  <div class="map-link">
    <a href="https://www.google.com/maps/place/33%C2%B035'00.7%22N+130%C2%B024'07.7%22E/@33.5834536,130.4021623,21z/data=!4m4!3m3!8m2!3d33.583528!4d130.4021251!5m1!1e4!18m1!1e1"
       target="_blank" rel="noopener">
      Googleマップで場所を確認する
    </a>
  </div>

  <div class="notice">
    ✅ <strong>重要：</strong>
    正面玄関前ではなく
    <strong>「車寄せ入口（北西側）」</strong>へお越しください
  </div>

  <div class="description">
    車寄せの入口は建物の<strong>北西側</strong>にあります。<br>
    建物周辺に着いたら、正面で停めずに北西側の車路（車寄せ入口）へ回り込み、<br>
    屋根のある車寄せスペースに進入してください。
  </div>

  <div class="photo-list">
    <figure>
      <img src="fukuoka/images/entrance.jpg" alt="車寄せ入口（北西側）">
      <figcaption>車寄せ入口（北西側）</figcaption>
    </figure>

    <figure>
      <img src="fukuoka/images/wide.jpg" alt="入口が分かる引きの写真">
      <figcaption>入口が分かる引きの写真</figcaption>
    </figure>
  </div>

  <div class="note">
    ※出口は北東側です。
  </div>

</div>

</body>
</html>
