<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>車寄せ入口案内｜グランドメゾン福岡 The Central Luxe</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f6f6f6;
  color:#222;
}

.wrapper{
  max-width:720px;
  margin:40px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:28px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}

h1{
  font-size:22px;
  margin:0 0 14px;
}

.notice{
  background:#f1f7ff;
  border-left:4px solid #2563eb;
  padding:14px 16px;
  margin:18px 0;
  line-height:1.7;
}

.notice strong{
  color:#1d4ed8;
}

p{
  line-height:1.8;
  margin:14px 0;
}

.photo-list{
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:22px;
  align-items:center;
}

.photo-list figure{
  margin:0;
  text-align:center;
}

.photo-list img{
  width:55%;
  max-width:420px;
  min-width:260px;
  border-radius:14px;
  border:1px solid #e5e5e5;
}

.photo-list figcaption{
  font-size:13px;
  color:#555;
  margin-top:8px;
}
</style>
</head>

<body>
<div class="wrapper">
  <div class="card">

    <h1>グランドメゾン福岡 The Central Luxe　車寄せ入口</h1>

    <div class="notice">
      ✅ <strong>重要：</strong>正面玄関前ではなく<br>
      <strong>「車寄せ入口（北西側）」</strong>へお越しください
    </div>

    <p>
      車寄せの入口は建物の<strong>北西側</strong>にあります。<br>
      建物周辺に着いたら、正面で停めずに北西側の車路（車寄せ入口）へ回り込み、<br>
      屋根のある車寄せスペースに進入してください。
    </p>

    <div class="photo-list">
      <figure>
        <img src="fukuoka/images/entrance.jpg" alt="車寄せ入口（北西側）">
        <figcaption>車寄せ入口（北西側）</figcaption>
      </figure>

      <figure>
        <img src="fukuoka/images/wide.jpg" alt="入口が分かる引きの写真">
        <figcaption>入口が分かる引きの写真</figcaption>
      </figure>
    </div>

    <p style="margin-top:26px;font-size:13px;color:#555;">
      ※出口は北東側です。
    </p>

  </div>
</div>
</body>
</html>
