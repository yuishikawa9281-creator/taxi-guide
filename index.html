<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>車寄せ入口案内</title>

<style>
body{
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:40px 0;
}

.card{
  background:#fff;
  max-width:760px;
  margin:0 auto;
  padding:36px 32px 40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
}

/* タイトル */
h1{
  font-size:22px;
  margin:0 0 10px;
  font-weight:700;
}

/* 注意ボックス */
.notice{
  margin:22px 0 24px;
  padding:14px 16px;
  background:#f0f6ff;
  border-left:4px solid #3b82f6;
  border-radius:8px;
  text-align:left;
  font-size:15px;
}
.notice strong{
  color:#1e40af;
}

/* 説明文 */
.desc{
  text-align:left;
  font-size:15px;
  line-height:1.7;
  margin-bottom:28px;
}

/* 写真 */
figure{
  margin:0 0 26px;
}
figure img{
  width:100%;
  max-width:520px;
  border-radius:14px;
}
figcaption{
  margin-top:10px;
  font-size:2em;
  font-weight:700;
}

/* ★ここが重要：2行分の空白 */
.space-2lines{
  height:3.2em; /* ← テキスト2行分を確保 */
}

/* 強調テキスト */
.focus-text{
  font-size:2em;
  font-weight:800;
  margin-bottom:10px;
}

/* Googleマップリンク */
.map-link{
  display:inline-block;
  margin-top:10px;
  font-size:2.5em;
  font-weight:700;
  color:#1a73e8;
  text-decoration:none;
}
.map-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="card">

  <h1>【グランドメゾン福岡 The Central Luxe　車寄せ入口】</h1>

  <div class="notice">
    ✅ <strong>重要：</strong>正面玄関前ではなく  
    「<strong>車寄せ入口（リハビリ専門学校側）</strong>」へお越しください
  </div>

  <div class="desc">
    車寄せの入口は建物のリハビリ専門学校側にあります。<br>
    建物周辺に着いたら、正面で停めずにリハビリ専門学校側の車路（車寄せ入口）へ回り込み、  
    屋根のある車寄せスペースに進入してください。
  </div>

  <!-- 写真1 -->
  <figure>
    <img src="fukuoka/images/entrance.jpg" alt="車寄せ入口（北西側）">
    <figcaption>車寄せ入口（リハビリ専門学校側）</figcaption>
  </figure>

  <!-- 写真2 -->
  <figure>
    <img src="fukuoka/images/wide.jpg" alt="入口位置の目安">
  </figure>

  <!-- ★2行分の空白 -->
  <div class="space-2lines"></div>

  <!-- 強調テキスト -->
  <div class="focus-text">▼ この辺りに入り口があります ▼</div>

  <!-- Googleマップリンク -->
  <a
    class="map-link"
    href="https://www.google.com/maps/place/33%C2%B035'00.7%22N+130%C2%B024'07.7%22E/@33.5834536,130.4021623,21z"
    target="_blank"
  >
    Googleマップで場所を確認する
  </a>

</div>

</body>
</html>
