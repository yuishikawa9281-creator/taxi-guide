<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>車寄せ入口案内｜東京ツインパークス ライトウィング</title>

  <style>
    body{
      background:#f5f6f8;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      margin:0;
      padding:40px 0;
    }

    .card{
      background:#fff;
      max-width:760px;
      margin:0 auto;
      padding:36px 32px 40px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      text-align:center;
    }

    /* タイトル（改行なし・はみ出し防止） */
    h1{
      font-size: clamp(18px, 3.2vw, 26px);
      margin: 0 0 14px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      max-width: 100%;
      padding: 0 12px;
      box-sizing: border-box;
    }

    /* 2枚の写真の間に入れる見出し（大阪版の雰囲気寄せ） */
    h2{
      font-size: clamp(22px, 4.6vw, 40px);
      margin: 14px 0 18px;
      font-weight: 800;
      line-height: 1.15;
      text-align:center;
      letter-spacing: .02em;
    }

    /* ✅ポイント（青） */
    .notice{
      background:#eef6ff;
      border:1px solid #cfe4ff;
      border-radius:12px;
      padding:16px 16px;
      text-align:left;
      line-height:1.65;
      font-size:16px;
      margin: 14px 0 12px;
    }

    /* 📌よくある間違い（黄） */
    .warning{
      background:#fff7e6;
      border:1px solid #ffe0a6;
      border-radius:12px;
      padding:16px 16px;
      text-align:left;
      line-height:1.65;
      font-size:16px;
      margin: 0 0 22px;
    }

    figure{
      margin:0;
    }

    img{
      width:100%;
      max-width:680px;
      height:auto;
      border-radius:16px;
      display:block;
      margin: 0 auto;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    /* ▼この辺りに入口があります▼ */
    .focus-text{
      font-size: clamp(18px, 4.8vw, 38px);
      font-weight: 900;
      margin: 0 0 18px;
      letter-spacing: .03em;
    }

    /* Googleマップリンク（青で大きく） */
    .map-link{
      display:inline-block;
      font-size: clamp(26px, 6vw, 52px);
      font-weight: 900;
      text-decoration:none;
      color:#2f6fed;
      margin-top: 6px;
    }

    /* 写真と次要素の余白（大阪っぽく） */
    .space-24{ height:24px; }
    .space-32{ height:32px; }
    .space-40{ height:40px; }
  </style>
</head>

<body>
  <div class="card">

    <h1>【東京ツインパークス ライトウィング　車寄せ入口】</h1>

    <div class="notice">
      ✅ <strong>ポイント</strong><br>
      ・東京ツインパークス ライトウィングの「481号線沿い」に入口があります<br>
      ・地上ではなく、地下（B1）へ進入してください
    </div>

    <div class="warning">
      📌 <strong>よくある間違い（重要）</strong><br>
      ・東京ツインパークス レフトウィング
    </div>

    <!-- 写真1：外観（入り方） -->
    <figure>
      <img src="images/wide.jpg" alt="車寄せ入口（外観）">
    </figure>

    <!-- 2枚の写真の間に入れる -->
    <h2>車寄せ入口</h2>

    <!-- 写真2：入口位置の目安 -->
    <figure>
      <img src="images/entrance.jpg" alt="入口位置の目安">
    </figure>

    <!-- 写真と▼の間をしっかり空ける -->
    <div class="space-40"></div>

    <div class="focus-text">▼ この辺りに入口があります ▼</div>

    <a
      class="map-link"
      href="https://www.google.com/maps?q=35.6608259,139.7591927&entry=gps&lucs=,94297699,94275415,94284460,94231188,94280568,47071704,94218641,94282134,94286869&g_ep=CAISEjI1LjQ5LjkuODM4ODk5MTgzMBgAIIgnKlEsOTQyOTc2OTksOTQyNzU0MTUsOTQyODQ0NjAsOTQyMzExODgsOTQyODA1NjgsNDcwNzE3MDQsOTQyMTg2NDEsOTQyODIxMzQsOTQyODY4NjlCAkpQ&skid=83d3e137-c5c6-42f8-8903-195aaf9d6087&g_st=il"
      target="_blank"
      rel="noopener"
    >
      Googleマップで場所を確認する
    </a>

  </div>
</body>
</html>
