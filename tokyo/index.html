<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>車寄せ入口案内｜東京ツインパークス ライトウィング</title>

<style>
body{
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:40px 0;
}

.card{
  background:#fff;
  max-width:760px;
  margin:0 auto;
  padding:36px 32px 40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
}

/* タイトル（改行なし） */
h1{
  font-size:clamp(18px,3.2vw,26px);
  margin:0 0 20px;
  font-weight:700;
  white-space:nowrap;
}

/* ポイント（青） */
.notice{
  background:#eef4ff;
  padding:16px;
  border-radius:12px;
  margin-bottom:20px;
  text-align:left;
}

/* 注意（赤） */
.warning{
  background:#fff1f1;
  padding:16px;
  border-radius:12px;
  margin-bottom:30px;
  text-align:left;
}

/* 写真 */
figure{
  margin:0 0 36px;
}
figure img{
  width:100%;
  border-radius:14px;
}

/* 写真間タイトル */
.between-title{
  font-size:clamp(22px,4vw,30px);
  font-weight:800;
  margin:28px 0 28px;
}

/* 強調テキスト */
.focus-text{
  font-size:2em;
  font-weight:800;
  margin:48px 0 20px;
}

/* マップリンク */
.map-link{
  display:inline-block;
  font-size:1.8em;
  font-weight:800;
  color:#2f6fed;
  text-decoration:none;
}
</style>
</head>

<body>
<div class="card">

<h1>東京ツインパークス ライトウィング　車寄せ入口</h1>

<div class="notice">
✅ <strong>ポイント</strong><br>
・東京ツインパークス ライトウィングの「481号線沿い」に入口があります<br>
・地上ではなく、地下（B1）へ進入してください
</div>

<div class="warning">
📌 <strong>よくある間違い（重要）</strong><br>
・東京ツインパークス レフトウィング
</div>

<!-- 写真1：車寄せ入口 -->
<figure>
  <img src="images/wide.jpg" alt="車寄せ入口">
</figure>

<!-- 写真間タイトル -->
<div class="between-title">車寄せ入口</div>

<!-- 写真2：入口付近 -->
<figure>
  <img src="images/entrance.jpg" alt="車寄せ入口（詳細）">
</figure>

<div class="focus-text">▼ この辺りに入口があります ▼</div>

<a
  class="map-link"
  href="https://www.google.com/maps?q=35.6608259,139.7591927&entry=gps"
  target="_blank"
  rel="noopener"
>
Googleマップで場所を確認する
</a>

</div>
</body>
</html>
