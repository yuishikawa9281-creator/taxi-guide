<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>車寄せ入口案内｜東京ツインパークス ライトウィング</title>

<style>
body{
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  padding:40px 0;
}

.card{
  background:#fff;
  max-width:760px;
  margin:0 auto;
  padding:36px 32px 40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
}

/* タイトル（改行なし・はみ出し防止） */
h1{
  font-size: clamp(18px, 3.2vw, 26px);
  margin: 0 0 16px;
  font-weight: 700;
  line-height: 1.2;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
  max-width: 100%;
  padding: 0 12px;
  box-sizing: border-box;
}

/* ポイント */
.notice{
  margin:22px 0 24px;
  padding:16px 18px;
  background:#f0f6ff;
  border-left:4px solid #3b82f6;
  border-radius:8px;
  text-align:left;
  font-size:15px;
  line-height:1.7;
}
.notice strong{ color:#1e40af; }


/* 写真 */
figure{ margin:0 0 26px; }
figure img{
  width:100%;
  max-width:520px;
  border-radius:14px;
}
figcaption{
  margin-top:10px;
  font-size:1.6em;
  font-weight:700;
}

/* 強調テキスト */
.focus-text{
  font-size:2em;
  font-weight:800;
  margin-bottom:10px;
}

/* Googleマップリンク */
.map-link{
  display:inline-block;
  margin-top:10px;
  font-size:2.5em;
  font-weight:700;
  color:#1a73e8;
  text-decoration:none;
}
.map-link:hover{ text-decoration:underline; }
</style>
</head>

<body>

<div class="card">

  <h1>【東京ツインパークス ライトウィング　車寄せ入口】</h1>

  <div class="notice">
    ✅ <strong>ポイント</strong><br>
    ・東京ツインパークス ライトウィングの「481号線沿い」に入口があります<br>
    ・地上ではなく、地下（B1）へ進入してください
  </div>


  <!-- 写真1：外観（入り方） -->
  <figure>
    <img src="wide.jpg" alt="車寄せの入り方">
  </figure>

  <!-- 写真2：車寄せ入口 -->
  <figure style="margin-bottom:90px;">
    <img src="entrance.jpg" alt="車寄せ入口">
  </figure>

  <div class="focus-text">▼ この辺りに入口があります ▼</div>

  <a
    class="map-link"
    href="https://www.google.com/maps?q=35.6608259,139.7591927&entry=gps&lucs=,94297699,94275415,94284460,94231188,94280568,47071704,94218641,94282134,94286869&g_ep=CAISEjI1LjQ5LjkuODM4ODk5MTgzMBgAIIgnKlEsOTQyOTc2OTksOTQyNzU0MTUsOTQyODQ0NjAsOTQyMzExODgsOTQyODA1NjgsNDcwNzE3MDQsOTQyMTg2NDEsOTQyODIxMzQsOTQyODY4NjlCAkpQ&skid=83d3e137-c5c6-42f8-8903-195aaf9d6087&g_st=il"
    target="_blank"
    rel="noopener"
  >
    Googleマップで場所を確認する
  </a>

</div>

</body>
</html>
